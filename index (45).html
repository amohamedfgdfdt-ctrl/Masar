*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom,0px))}
img{display:block;max-width:100%}
button,input{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
.view{display:none}.view.on{display:block;animation:vin .45s var(--ea) both}
@keyframes vin{from{opacity:0;transform:translate3d(0,18px,0)}}
.rv{animation:rv .8s var(--ea) both;animation-delay:calc(var(--i)*70ms + 1.45s)}
@keyframes rv{from{opacity:0;transform:translate3d(0,26px,0)}}
/* splash */
#sp{position:fixed;inset:0;z-index:100;background:#E8D5A8;display:grid;place-content:center;justify-items:center;gap:6px;animation:sx .7s 1.35s cubic-bezier(.6,0,.4,1) forwards}
#sp img{width:128px;animation:lg 1s var(--sp) both}
#sp b{font:700 38px 'Aref Ruqaa',serif;color:#161616;animation:lt .8s .35s var(--ea) both}
@keyframes lg{from{opacity:0;transform:translate3d(0,40px,0) scale(.5) rotate(-8deg)}}
@keyframes lt{from{opacity:0;transform:translate3d(0,16px,0)}}
@keyframes sx{to{opacity:0;transform:scale(1.12)}}
/* header */
.hd{position:relative;margin:0 -14px;height:236px;overflow:hidden}
.hd .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:brightness(.55) saturate(.9)}
.hd:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.2),var(--bg) 96%)}
.hdc{position:absolute;z-index:1;inset-inline:18px;bottom:30px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:54px}
h1{font:700 44px/1 'Aref Ruqaa',serif;color:#fff}
.hdc p{font-size:15px;margin-top:6px;opacity:.9}.hdc small{color:var(--gold);font-size:12px}
/* cards */
.cd{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:14px;overflow:hidden;contain:paint;box-shadow:0 14px 30px -16px #000}
.cd h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cd h3 i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(201,164,92,.14);font-size:16px}
.cd h3 .go{margin-inline-start:auto;color:var(--mu);font-size:22px;line-height:1}
.goal{margin-top:-8px;padding:0;min-height:140px;border-color:rgba(232,213,168,.25)}
.goal>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:brightness(.62)}
.goal:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(270deg,rgba(8,8,10,.78),rgba(8,8,10,.15))}
.gc{position:relative;z-index:2;padding:16px;display:grid;gap:12px}
.gh{display:flex;gap:12px;align-items:center}.gh>div{flex:1}
.goal h2{font:700 24px 'Cairo';color:var(--gold)}
.goal input{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.35);padding:6px 0;font-size:16px;color:#fff;transition:border-color .25s}
.goal input:focus{outline:0;border-bottom-color:var(--gold)}.goal input::placeholder{color:rgba(255,255,255,.55)}
.gi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:26px;font-style:normal}
.edit{justify-self:start;padding:6px 14px;border:1px solid var(--gold);border-radius:12px;color:var(--gold);font-size:13px;transition:transform .3s var(--sp)}
.edit:active{transform:scale(.92)}
.tiles{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:8px;margin-top:12px}
.tl2{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px 4px;text-align:center;font-size:12px;display:grid;gap:3px;place-items:center;transition:transform .35s var(--sp)}
.tl2:active{transform:scale(.94)}
.tl2 i{font-style:normal;font-size:22px}.tl2 b{font-size:13px}.tl2 small{color:var(--mu);font-size:11px}
.tl2.ring{position:relative;padding:8px 2px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .pg{stroke:url(#gr);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.2s var(--ea)}
.ring b{position:absolute;top:30px;inset-inline:0;font-size:17px}
.say{direction:ltr;text-align:center;font-weight:600;font-size:18px;margin:14px 0 4px;color:var(--gold);min-height:1.5em}
.say.sw{animation:sw .7s var(--sp) both}
@keyframes sw{from{opacity:0;transform:translate3d(0,12px,0) scale(.96)}}
.g2{display:grid;gap:12px;margin-top:12px}
.it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln);margin-bottom:8px;font-size:14px}
.it .nm{flex:1;text-align:start}.it .tm{color:var(--mu);font-size:12px;direction:ltr;min-width:96px;text-align:start}
.it.done .nm{opacity:.5;text-decoration:line-through}
.ic{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(201,164,92,.14)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;font-size:14px;color:transparent;flex:none;transition:transform .3s var(--sp),background .25s}
.done>.ck,.done .ck:first-child,.ck.on{background:var(--gr);border-color:var(--gr);color:#07140b}
.ck:active{transform:scale(.8)}
.add{width:100%;padding:11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--ln);color:var(--mu);font-size:14px}
/* prayers */
.pc{min-height:430px}
.pc .mos{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.4)}
.pc:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(8,8,10,.4),rgba(8,8,10,.75))}
.pc>*:not(.mos){position:relative;z-index:2}
.orb{position:relative;height:300px;margin:0 auto;max-width:330px}
.ctr{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:rgba(10,10,12,.88);border:1px solid rgba(232,213,168,.25);display:grid;place-content:center;text-align:center;box-shadow:0 0 40px rgba(232,213,168,.12)}
.ctr b{font-size:22px;color:#fff}.ctr em{font-style:normal;font-size:30px;font-weight:700;color:var(--gold);line-height:1.1}.ctr small{color:var(--mu);font-size:12px}
.pb{position:absolute;width:76px;height:76px;margin:-38px;border-radius:50%;background:rgba(10,10,12,.88);border:1px solid var(--ln);display:grid;place-content:center;text-align:center;font-size:12px;line-height:1.3;transition:transform .4s var(--sp),border-color .3s}
.pb:active{transform:scale(.9)}.pb span{color:var(--mu);font-size:11px;direction:ltr}
.pb.next{border-color:var(--gold);box-shadow:0 0 18px rgba(232,213,168,.35)}
.pb.on:after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;background:var(--gr);color:#07140b;font-size:12px;display:grid;place-items:center;font-weight:700}
.pill{margin-top:8px;padding:10px;border-radius:14px;background:rgba(255,255,255,.07);text-align:center;font-size:14px}
/* notes */
.stk{position:relative;display:grid;gap:10px}
.nt{position:relative;border-radius:10px 10px 18px 10px;padding:12px 14px;font-size:15px;line-height:1.6;min-height:70px;background:#1A1A1F;border:1px solid var(--ln);box-shadow:0 10px 18px -8px #000;transition:transform .35s var(--sp)}
.nt:first-child{background:linear-gradient(150deg,#F6E9C8,#D9BE86);color:#2a2008;transform:rotate(-1.2deg);border:0}
.nt .xx{position:absolute;top:4px;inset-inline-end:8px;color:inherit;opacity:.55;font-size:20px}
.nt div{outline:0;min-height:36px;padding-top:4px;word-break:break-word}
.nt:before{content:none;position:absolute;top:-8px;inset-inline-start:12px;font-size:16px}
/* subtasks */
.sbar{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0}
.sbar i{display:block;height:100%;width:0;background:var(--gr);border-radius:7px;transition:width .9s var(--ea)}
.sbx{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.sbx.d span{opacity:.5;text-decoration:line-through}.sbx span{flex:1}
.qt{padding:0;min-height:120px}
.qt>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;filter:brightness(.55)}
.qt:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(270deg,rgba(8,8,10,.85),rgba(8,8,10,.1))}
.qt .qc{position:relative;z-index:2;padding:18px;font-weight:600;font-size:16px;line-height:1.7;max-width:62%}
.qt .sbar{position:absolute;z-index:2;bottom:12px;inset-inline:18px;margin:0}
/* forms/tasks */
.row{display:flex;gap:8px;margin:10px 0}
.in{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;transition:border-color .25s}
.in:focus{outline:0;border-color:var(--gold)}
.btn{background:linear-gradient(135deg,var(--gold),#A8832F);color:#1a1405;font-weight:700;padding:10px 16px;border-radius:12px;transition:transform .3s var(--sp)}.btn:active{transform:scale(.93)}
.btn.dg{background:#2a1d1d;color:#ff9db0}
.tk{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.th{display:flex;align-items:center;gap:10px}.th .nm{flex:1}.th small{color:var(--mu);direction:ltr}
.tk.done .nm{opacity:.5;text-decoration:line-through}
.subw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ea)}.tk.open .subw{grid-template-rows:1fr}.subw>div{overflow:hidden}
.sec{color:var(--mu);font-size:13px;margin:22px 4px 8px;letter-spacing:.06em}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bars div{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--gold),#7a5c1e);min-height:4px;transform-origin:bottom;animation:gr .8s var(--ea) both;animation-delay:calc(var(--k)*60ms)}
@keyframes gr{from{transform:scaleY(0)}}
.lab{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--mu);text-align:center}.lab span{flex:1}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.st3 b{font-size:28px;display:block;color:var(--gold)}.st3 small{color:var(--mu);font-size:12px}
/* dock */
.dock{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;display:flex;justify-content:center;pointer-events:none;padding:0 14px}
.dock nav{pointer-events:auto;display:flex;width:100%;max-width:492px;background:rgba(14,14,17,.96);border:1px solid var(--ln);border-radius:26px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.7)}
.tab{flex:1;padding:8px 0;border-radius:20px;color:var(--mu);font:600 12px Cairo;display:grid;gap:1px;justify-items:center;transition:background .3s,color .3s,transform .4s var(--sp)}
.tab span{font-size:21px;filter:grayscale(1) brightness(1.3);transition:filter .3s}
.tab[aria-selected=true]{background:rgba(232,213,168,.14);color:var(--gold);transform:translate3d(0,-3px,0)}.tab[aria-selected=true] span{filter:none}
#al{position:fixed;inset-inline:14px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:50;padding:14px;border-radius:16px;background:var(--gold);color:#1a1405;font-weight:700;text-align:center;transform:translate3d(0,-180%,0);transition:transform .6s var(--sp)}#al.on{transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:430px;padding-inline:12px}
.hd{margin:0 -12px;height:clamp(190px,54vw,230px)}
.hdc{inset-inline:16px;bottom:26px}h1{font-size:clamp(36px,11vw,44px)}.brand img{width:clamp(44px,13vw,54px)}
.cd{border-radius:20px;padding:12px}
.goal{padding:0;min-height:clamp(130px,38vw,150px)}.qt{padding:0;min-height:clamp(110px,32vw,130px)}
.tiles{grid-template-columns:repeat(6,1fr)}
.tiles>:nth-child(-n+3){grid-column:span 2}.tiles>:nth-child(n+4){grid-column:span 3}
.tl2{padding:12px 6px;font-size:13px;min-height:104px;align-content:center}.tl2 b{font-size:14px}
.orb{width:100%;max-width:340px;height:auto;aspect-ratio:1/.96}
.ctr{width:44%;height:auto;aspect-ratio:1;margin:0;translate:-50% -50%}
.ctr b{font-size:clamp(17px,5.4vw,22px)}.ctr em{font-size:clamp(24px,8vw,30px)}
.pb{width:23%;min-width:62px;height:auto;aspect-ratio:1;margin:0;translate:-50% -50%;font-size:clamp(11px,3.4vw,12.5px)}
.pc{min-height:0}
.ck{width:30px;height:30px;position:relative}.ck:before{content:"";position:absolute;inset:-8px}
.it{padding:8px 9px;gap:8px}.it .tm{min-width:0;width:92px;font-size:11.5px}
.frm{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:10px 0}.frm .in{width:100%;flex:none}.frm #ti{grid-column:1/-1}
.dock nav{max-width:406px}
@media(min-width:560px){body{background:#000}.app{background:var(--bg);box-shadow:0 0 0 1px var(--ln),0 0 90px #000;min-height:100vh}}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cd h3 i{color:var(--pu)}.cd h3 i .i{width:17px;height:17px}.cd h3 .go .i{width:20px;height:20px}
.gi{color:var(--gold)}.gi .i{width:28px;height:28px}
.edit{display:inline-flex;align-items:center;gap:6px}.edit .i{width:14px;height:14px}
.tl2 i .i{width:26px;height:26px}.t-g{color:var(--gr)}.t-b{color:#7DB8FF}.t-o{color:#FFA94D}.t-p{color:var(--pu)}
.ic{color:var(--pu)}.ic .i{width:17px;height:17px}
.ck .i{width:16px;height:16px;stroke-width:3}
.nt:before{content:none!important}.nt .pin{position:absolute;top:-9px;inset-inline-start:12px;width:18px;height:18px;color:var(--gold);transform:rotate(-20deg)}.nt:first-child .pin{color:#5a430c}
.tab span{filter:none!important;display:grid}.tab .i{width:23px;height:23px}
.ctr em .i{width:32px;height:32px;color:var(--gr);stroke-width:3}

.cd,.tl2{background:var(--card) var(--tile) 0 0/256px}
.vb{position:relative;height:118px;margin:16px 0 12px;padding:16px;display:flex;align-items:flex-end;border-radius:22px;border:1px solid var(--ln);overflow:hidden;background:linear-gradient(0deg,rgba(8,8,10,.7),transparent 65%),var(--ban) var(--bp,0%) 50%/auto 100%}
.vb h2{font-size:26px;font-weight:700;color:#fff}.vb1{--bp:0%}.vb2{--bp:55%}.vb3{--bp:100%}
.ctr b .i{width:30px;height:30px;color:var(--gr);stroke-width:3}.ctr em{font-size:clamp(22px,7vw,28px)}
.pb{font-weight:600;font-size:clamp(12px,3.6vw,13.5px)}
.vb{height:clamp(160px,44vw,200px);margin:0 -12px 12px;padding:16px 18px;border:0;border-radius:0;background:linear-gradient(180deg,rgba(8,8,10,.5),var(--bg) 97%),var(--hdr) 50% 40%/cover}
.vb h2{font-size:28px}
.frm{grid-template-columns:1fr auto}.frm #ti{grid-column:auto}
.t-g{color:#E8D5A8}.t-b{color:#D9BE86}.t-o{color:#C9A45C}.t-p{color:#F6E9C8}
.rv{animation-duration:.45s;animation-delay:calc(var(--i)*30ms + 1s)}
#sp{animation:sx .5s 1.1s cubic-bezier(.6,0,.4,1) forwards}
h1{line-height:1.25}
#sp{display:block;overflow:hidden}
.spc{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
#sp img{width:116px;height:auto;animation:lg2 .9s var(--sp) both}
#sp b{margin-top:0;font:700 42px/1.35 'Aref Ruqaa',serif;color:#161616;animation:lt .7s .3s var(--ea) both}
@keyframes lg2{from{opacity:0;transform:translate3d(0,30px,0) scale(.6)}}
.dl{position:relative;width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:50%;color:var(--mu);transition:color .2s,transform .3s var(--sp)}
.dl:before{content:"";position:absolute;inset:-6px}.dl:active{transform:scale(.82);color:#ff8f9f}.dl .i{width:17px;height:17px}
.ut{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);margin-inline:auto;max-width:406px;z-index:30;background:#1e1e24;border:1px solid var(--ln);border-radius:14px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;transform:translate3d(0,30px,0);opacity:0;pointer-events:none;transition:transform .35s var(--ea),opacity .35s}
.ut.on{transform:none;opacity:1;pointer-events:auto}.ut button{color:var(--gold);font-weight:700;padding:4px 8px}
.sw{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--ln);color:var(--mu);font-size:14px;font-weight:600;flex:none;transition:color .3s,border-color .3s}
.sw i{position:relative;width:40px;height:23px;border-radius:12px;background:#2a2a30;transition:background .3s}
.sw i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#9b97a8;transition:transform .35s var(--sp),background .3s}
.sw.on{color:var(--gold);border-color:rgba(232,213,168,.4)}.sw.on i{background:var(--gold)}.sw.on i:after{background:#1a1405;transform:translateX(-17px)}
#sp img{display:block}
.nmi{flex:1;padding:7px 10px;font-size:15px}.sbx .in{padding:6px 10px;font-size:14px}
.sw{gap:7px;padding:0 14px;background:rgba(255,255,255,.04)}.sw .i{width:18px;height:18px}.sw.on{background:rgba(232,213,168,.16)}.sw:active{transform:scale(.95)}
</style>

var PN=['الفجر','الظهر','العصر','المغرب','العشاء'],PS=[[50,13],[85,39],[71,80],[29,80],[15,39]];
$('dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
function tt(){return T.filter(function(t){return t.d===today}).sort(function(a,b){return a.id-b.id})}
function pd(){return PR[today]||(PR[today]={})}
function stats(){var a=tt(),dn=a.filter(function(t){return t.done}).length,p=PN.filter(function(n){return pd()[n]}).length;return{a:a,dn:dn,p:p,pct:Math.round((dn+p)/(a.length+5)*100)}}
function I(n,c){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function icon(n){return I(/gym|جيم|رياضة|تمرين/i.test(n)?'gym':/راحة|استراحة/.test(n)?'coffee':/مذاك|مدرس|رياض|فيز|كيم|انجليز|مراجع|درس|قراء/.test(n)?'book':'pin')}
function fmt(t){return t.t?(t.e?t.t+' - '+t.e:t.t):'--:--'}
var SAY=[[0,'A fresh day. Take the first step.'],[1,'Keep going. Every step counts.'],[20,'Nice start. Build the momentum.'],[40,'Halfway there. Stay steady.'],[60,"You're on fire. Don't stop now."],[80,'Almost there. Finish strong.'],[100,'Perfect day. You earned it.']],last='';
function sayUp(p){var t=SAY[0][1];SAY.forEach(function(x){if(p>=x[0])t=x[1]});if(t===last)return;last=t;var e=$('say');e.classList.remove('sw');void e.offsetWidth;e.textContent=t;e.classList.add('sw')}
/* prayers orbit (built once) */
(function(){var o=$('orb');PN.forEach(function(n,i){var b=document.createElement('button');b.className='pb';b.id='pb'+i;b.style.left=PS[i][0]+'%';b.style.top=PS[i][1]+'%';b.dataset.pr=i;b.textContent=n;o.appendChild(b)})})();
function prUp(){
  var d=new Date(),nw=pad(d.getHours())+':'+pad(d.getMinutes()),ix=-1,i;
  for(i=0;i<5;i++)if(TM[i]>=nw&&!pd()[PN[i]]){ix=i;break}
  if(ix<0)for(i=0;i<5;i++)if(!pd()[PN[i]]){ix=i;break}
  PN.forEach(function(n,k){var b=$('pb'+k);b.className='pb'+(pd()[n]?' on':'')+(k===ix?' next':'')});
  var c=PN.filter(function(n){return pd()[n]}).length;
  if(ix<0){$('cn').textContent='ما شاء الله';$('ct').innerHTML=I('check');$('cc').textContent='كملت صلواتك'}
  else{$('cn').textContent=PN[ix];$('ct').innerHTML='';$('cc').textContent='الصلاة القادمة'}
  $('pp').textContent='صلواتك اليوم '+c+' / 5';$('t-p').textContent=c+'/5 مكتملة';
}
/* render */
function render(){
  var s=stats();H[today]=s.pct;sv('hist',H);sv('tasks',T);sv('pr',PR);sv('notes',N);
  $('pc').textContent=s.pct+'%';$('pf').style.strokeDashoffset=100-s.pct;$('qb').style.width=s.pct+'%';sayUp(s.pct);
  $('pm').textContent=(s.dn)+' من '+s.a.length+' مهمة';$('t-t').textContent=s.a.length+' مهام اليوم';$('t-n').textContent=N.length+' ملاحظات';
  $('g2').textContent=G||'اكتب هدفك من الرئيسية';
  $('hs').innerHTML=s.a.length?s.a.slice(0,6).map(function(t){return '<div class="it'+(t.done?' done':'')+'"><span class="nm">'+esc(t.n)+'</span><i class="ic">'+icon(t.n)+'</i><button class="dl" data-del="'+t.id+'" aria-label="حذف المهمة">'+I('trash')+'</button><button class="ck'+(t.done?' on':'')+'" data-tg="'+t.id+'" aria-label="تم">'+I('check')+'</button></div>'}).join(''):'<p style="color:var(--mu);font-size:14px;margin-bottom:10px">مفيش مهام لليوم</p>';
  var ft=null;s.a.concat(T).forEach(function(t){if(!ft&&t.s&&t.s.length&&!t.done)ft=t});
  if(ft){var dn=ft.s.filter(function(x){return x.done}).length;$('hf').innerHTML='<b style="font-size:15px">'+esc(ft.n)+'</b><div class="sbar"><i style="width:'+(dn/ft.s.length*100)+'%"></i></div><small style="color:var(--mu)">'+dn+'/'+ft.s.length+'</small>'+ft.s.map(function(x,j){return '<div class="sbx'+(x.done?' d':'')+'"><span>'+esc(x.n)+'</span><button class="ck'+(x.done?' on':'')+'" data-sub="'+ft.id+':'+j+'">'+I('check')+'</button></div>'}).join('');$('t-s').textContent=dn+'/'+ft.s.length}
  else{$('hf').innerHTML='<p style="color:var(--mu);font-size:14px">أضف مهام فرعية من صفحة المهام</p>';$('t-s').textContent='لا يوجد'}
  $('hn').innerHTML=N.length?N.slice(-3).reverse().map(function(n){return '<div class="nt" data-go="notes">'+I('pin').replace('class="i"','class="i pin"')+'<div>'+esc(n.x||'ملاحظة فاضية')+'</div></div>'}).join(''):'<p style="color:var(--mu);font-size:14px">لسه مفيش ملاحظات</p>';
  prUp();tasks();stat();
}
function tasks(){
  var L=$('tl'),a=stats().a;L.innerHTML=a.length?'':'<p style="color:var(--mu);font-size:14px;margin:8px 4px">لسه مفيش مهام لليوم.</p>';
  a.forEach(function(t){var e=document.createElement('div');e.className='tk'+(t.done?' done':'')+(open[t.id]?' open':'');
    e.innerHTML='<div class="th" data-open="'+t.id+'"><button class="ck'+(t.done?' on':'')+'" data-tg="'+t.id+'">'+I('check')+'</button>'+(ed[t.id]?'<input class="in nmi" data-en="'+t.id+'" value="'+ea(t.n)+'" aria-label="اسم المهمة">':'<span class="nm">'+esc(t.n)+'</span>')+'<button class="dl" data-del="'+t.id+'" aria-label="حذف المهمة">'+I('trash')+'</button></div><div class="subw"><div>'+(t.s||[]).map(function(x,j){return '<div class="sbx'+(x.done?' d':'')+'"><button class="ck'+(x.done?' on':'')+'" data-sub="'+t.id+':'+j+'">'+I('check')+'</button>'+(ed[t.id]?'<input class="in" data-es="'+t.id+':'+j+'" value="'+ea(x.n)+'" aria-label="المهمة الفرعية">':'<span>'+esc(x.n)+'</span>')+'<button data-xs="'+t.id+':'+j+'" style="color:var(--mu)">×</button></div>'}).join('')+'<div class="row"><input class="in" id="ni'+t.id+'" placeholder="مهمة فرعية"><button class="btn" data-as="'+t.id+'">+</button><button class="sw'+(ed[t.id]?' on':'')+'" data-ed="'+t.id+'" aria-pressed="'+(ed[t.id]?'true':'false')+'" aria-label="تعديل المهمة"><svg class="i"><use href="#i-pen"/></svg><span>تعديل</span></button></div></div></div>';L.appendChild(e)})}
function notes(){var L=$('nl');L.innerHTML=N.length?'':'<p style="color:var(--mu)">لسه مفيش ملاحظات.</p>';
  N.slice().reverse().forEach(function(n){var e=document.createElement('div');e.className='nt';e.innerHTML=I('pin').replace('class="i"','class="i pin"')+'<button class="xx" aria-label="حذف">×</button><div contenteditable="true" spellcheck="false"></div>';var ed=e.querySelector('[contenteditable]');ed.textContent=n.x;ed.oninput=function(){n.x=ed.textContent;sv('notes',N)};e.querySelector('.xx').onclick=function(){N.splice(N.indexOf(n),1);notes();render()};L.appendChild(e)})}
function stat(){var tot=T.filter(function(t){return t.done}).length,pr=0;Object.keys(PR).forEach(function(k){PN.forEach(function(n){if(PR[k][n])pr++})});
  var st=0,d=new Date();if((H[ds(d)]||0)<50)d.setDate(d.getDate()-1);while((H[ds(d)]||0)>=50){st++;d.setDate(d.getDate()-1)}
  $('s1').textContent=tot;$('s2').textContent=pr;$('s3').textContent=st;
  var b=$('bars'),l=$('lab');b.innerHTML='';l.innerHTML='';
  for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);var e=document.createElement('div');e.style.height=Math.max(4,(H[ds(x)]||0)*1.2)+'px';e.style.setProperty('--k',6-i);b.appendChild(e);var s=document.createElement('span');s.textContent=x.toLocaleDateString('ar-EG',{weekday:'short'});l.appendChild(s)}}
/* actions */
var lastDel=null,utT;
function find(id){return T.filter(function(t){return t.id===id})[0]}
function go(v,f){[].forEach.call(document.querySelectorAll('.view'),function(x){x.classList.toggle('on',x.id==='v-'+v)});[].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',b.dataset.go===v)});scrollTo({top:0});if(v==='notes')notes();if(v==='home')render();if(f)setTimeout(function(){$(f).focus()},60)}
document.addEventListener('click',function(e){if(e.target.closest('input'))return;var t=e.target.closest('[data-go],[data-tg],[data-pr],[data-sub],[data-open],[data-as],[data-del],[data-xs],[data-undo],[data-ed]');if(!t)return;var d=t.dataset,k;
  if(d.ed){ed[d.ed]=!ed[d.ed];open[d.ed]=1;render();return}
  if(d.tg){k=find(d.tg);k.done=!k.done;render();return}
  if(d.pr!==undefined){var n=PN[+d.pr];pd()[n]=!pd()[n];render();return}
  if(d.sub){var p=d.sub.split(':');k=find(p[0]);k.s[+p[1]].done=!k.s[+p[1]].done;if(k.s.every(function(x){return x.done}))k.done=true;render();return}
  if(d.xs){var q=d.xs.split(':');find(q[0]).s.splice(+q[1],1);open[q[0]]=1;render();return}
  if(d.as){var i=$('ni'+d.as);if(i.value.trim()){var f=find(d.as);(f.s=f.s||[]).push({n:i.value.trim(),done:false});open[d.as]=1;render()}return}
  if(d.undo!==undefined){if(lastDel){T.splice(lastDel.i,0,lastDel.t);lastDel=null;$('ut').classList.remove('on');render()}return}
  if(d.del){var ix=T.indexOf(find(d.del));lastDel={t:T[ix],i:ix};T.splice(ix,1);render();var u=$('ut');u.classList.add('on');clearTimeout(utT);utT=setTimeout(function(){u.classList.remove('on')},5000);return}
  if(d.open){if(e.target.closest('.ck'))return;open[d.open]=!open[d.open];t.parentNode.classList.toggle('open',!!open[d.open]);return}
  if(d.go)go(d.go,d.focus)});
document.addEventListener('input',function(e){var i=e.target,v=i.value,k,p;
  if(i.dataset.en){k=find(i.dataset.en);if(k&&v.trim()){k.n=v;sv('tasks',T)}}
  else if(i.dataset.es){p=i.dataset.es.split(':');k=find(p[0]);if(k&&v.trim()){k.s[+p[1]].n=v;sv('tasks',T)}}});
$('ta').onclick=function(){var n=$('ti').value.trim();if(!n){$('ti').focus();return}T.push({id:Date.now()+'',n:n,d:today,done:false,s:[]});$('ti').value='';render()};
$('ti').onkeydown=function(e){if(e.key==='Enter')$('ta').click()};
$('na').onclick=function(){N.push({x:''});render();notes();var c=document.querySelector('#nl [contenteditable]');if(c)c.focus()};
$('gi').value=G;$('gi').oninput=function(){G=this.value;sv('goal',G);$('g2').textContent=G||'اكتب هدفك من الرئيسية'};
$('ge').onclick=function(){$('gi').focus()};
/* splash cleanup + reminders */
$('sp').addEventListener('animationend',function(e){if(e.target===this)this.remove()});
function am(t){var a=$('al');a.textContent='تذكير: '+t;a.classList.add('on');setTimeout(function(){a.classList.remove('on')},10000);a.onclick=function(){a.classList.remove('on')};try{if('Notification' in window&&Notification.permission==='granted')new Notification('مَسَار',{body:t})}catch(x){}}
setInterval(prUp,30000);
try{document.documentElement.style.setProperty('--hdr','url("'+document.querySelector('.hd .bg').src+'")')}catch(e){}
render();
})();
</script>
</body>
</html>
